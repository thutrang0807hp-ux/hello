name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-download]
permissions:
  contents: read
concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r packaging/build-requirements.txt
      - name: Frozen entry tests
        run: python -m unittest discover -s tests -p "test_frozen_entry.py"
      - name: Storage and cleanup tests
        run: python scripts/run_build_step.py python -m unittest discover -s tests -p "test_storage_management.py"
      - name: Compact Telegram notification tests
        run: python scripts/run_build_step.py python -m unittest discover -s tests -p "test_job_notification.py"
      - name: Local ChatGPT bridge tests
        run: python scripts/run_build_step.py python -m unittest discover -s tests -p "test_chatgpt_bridge.py"
      - name: Package updated Toolkit bridge
        run: python toolkit-bridge/package.py --upgrade downloads/Toolkit-Installed-Build-Bridge.zip dist/chatgpt-extension
      - name: Build standalone application
        run: python scripts/run_build_step.py python -m PyInstaller --noconfirm --clean packaging/FreelanceDesk.spec
      - name: Validate frozen backend
        run: python scripts/run_build_step.py python tests/frozen_backend_smoke.py dist/FreelanceDesk/FreelanceDesk.exe
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 compiler unavailable' }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate installed application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'FreelanceDesk-install-smoke'
          $installer = Start-Process dist/installer/FreelanceDesk-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          python tests/frozen_backend_smoke.py "$installDir/FreelanceDesk.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare download website
        run: python scripts/prepare_download_site.py dist/installer/FreelanceDesk-Setup.exe dist/website
      - name: Upload installer and website
        uses: actions/upload-artifact@v4
        with:
          name: FreelanceDesk-Windows-x64
          path: dist/website/
          if-no-files-found: error
      - name: Package download website
        shell: pwsh
        run: Compress-Archive -Path dist/website/* -DestinationPath dist/FreelanceDesk-Download-Website.zip
      - name: Publish tested download files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            dist/website/FreelanceDesk-Setup.exe \
            dist/website/FreelanceDesk-Setup.exe.sha256 \
            dist/FreelanceDesk-Download-Website.zip \
            dist/chatgpt-extension/Toolkit-ChatGPT-Bridge.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Freelance Desk 1.2 - ChatGPT Chrome bridge preview" \
            --notes "Bản thử 1.2: cầu nối ChatGPT ngay trong Toolkit. Workspace, hồ sơ, bản nháp và phiên bản giữ trong app; extension điền yêu cầu vào tab ChatGPT đang đăng nhập, bạn tự bấm Gửi, chọn câu trả lời và xem trước trong app. Không đọc cookie, không dùng API cho luồng ChatGPT. Ngắt kết nối không đăng xuất Chrome. Cần cả EXE và Toolkit-ChatGPT-Bridge.zip. Đã kiểm thử backend và DOM mô phỏng; CHƯA xác minh đăng nhập/giao diện ChatGPT thật. Có thể cần sửa selector khi ChatGPT thay đổi. Giữ Telegram gọn và dọn dữ liệu 7/14 ngày. Bản cài chưa ký mã."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy download website
        id: deployment
        uses: actions/deploy-pages@v4
